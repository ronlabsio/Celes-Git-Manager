<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="GitDeck logo">
  <title>GitDeck</title>
  <defs>
    <linearGradient id="gd-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="0.5" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="gd-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="0.65" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gd-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E0E7FF"/>
    </linearGradient>
    <filter id="gd-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0B1020" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="12" y="12" width="232" height="232" rx="56" fill="url(#gd-bg)"/>
  <rect x="12" y="12" width="232" height="232" rx="56" fill="url(#gd-gloss)"/>

  <g filter="url(#gd-shadow)">
    <rect x="86" y="74" width="112" height="24" rx="12" fill="url(#gd-card)" opacity="0.55"/>
    <rect x="72" y="106" width="126" height="24" rx="12" fill="url(#gd-card)" opacity="0.8"/>
    <rect x="58" y="138" width="140" height="44" rx="16" fill="url(#gd-card)"/>
  </g>

  <g fill="none" stroke="#4F46E5" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
    <path d="M88 160 L88 92"/>
    <path d="M88 108 C88 92 100 84 116 84 L132 84"/>
  </g>
  <g fill="#4F46E5">
    <circle cx="88" cy="160" r="14"/>
    
    <circle cx="88" cy="92" r="8"/>
  </g>
  <g fill="#7C3AED">
    <circle cx="140" cy="84" r="14"/>
  </g>
  <g fill="none" stroke="#7C3AED" stroke-width="11" stroke-linecap="round">
    <path d="M140 98 L140 116 C140 132 152 140 166 140 L178 140"/>
  </g>
  <g fill="#06B6D4">
    <circle cx="178" cy="140" r="14"/>
  </g>
</svg>
